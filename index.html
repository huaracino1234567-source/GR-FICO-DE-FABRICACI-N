<style>
/* Layout: sala de control. Escena 3D a pantalla completa, panel de costos a la derecha (abajo en móvil), navegador de departamentos al pie que funciona como gráfico de costo acumulado. Se mantiene un solo look oscuro por decisión de diseño. */
:root{
  --bg:#0e1316;
  --panel:#161e22;
  --panel2:#1d282d;
  --line:#2b3a40;
  --fg:#e7edef;
  --muted:#92a4ab;
  --accent:#e8a33d;
  --warn:#e58f6c;
  --melaza:#b07a4f;
  --display:'Barlow Condensed','Arial Narrow',sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:14px/1.45 var(--body);overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{flex:none;border-bottom:1px solid var(--line);background:var(--bg)}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 20px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{min-width:0}
.brand h1{margin:0;font:700 26px/1 var(--display);letter-spacing:.04em;text-transform:uppercase}
.brand p{margin:3px 0 0;color:var(--muted);font-size:12px}
.ctrls{display:flex;flex-wrap:wrap;gap:6px}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:5px 10px;cursor:pointer;font-size:12px;line-height:1.2}
.btn:hover{background:var(--panel2)}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}

#stage{flex:1;min-height:0;position:relative;background:var(--bg)}
#stage canvas{position:absolute;inset:0;display:block;width:100%;height:100%}
.labels{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:2}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;border-radius:4px;border:1px solid var(--line);background:rgba(14,19,22,.86);padding:4px 8px;font:600 12px/1.2 var(--body);will-change:transform}
button.lbl{pointer-events:auto;cursor:pointer;display:flex;gap:6px;align-items:center}
button.lbl:hover{border-color:var(--c)}
button.lbl.on{border-color:var(--c);background:var(--c);color:#0e1316}
.lbl i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.lbl.on i{background:#0e1316}
.tag{font:500 11px/1.2 var(--mono);color:var(--muted)}
.tag b{color:var(--fg);font-weight:500}
.nogl{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}

.panel{position:absolute;z-index:5;top:12px;right:max(16px,env(safe-area-inset-right,0px));width:min(480px,calc(100% - 32px));max-height:calc(100% - 24px);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.phead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.ptag{display:flex;align-items:center;gap:8px;font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chip{width:10px;height:10px;border-radius:2px;display:inline-block}
.pmin{background:none;border:1px solid var(--line);border-radius:4px;padding:3px 8px;font-size:11px;cursor:pointer;color:var(--muted)}
.pbody{overflow:auto;padding:12px 14px 14px;min-height:0}
.panel.min .pbody{display:none}
.panel h2{margin:0 0 6px;font:700 28px/1.05 var(--display);letter-spacing:.02em;text-wrap:balance}
.lead{margin:0 0 12px;color:var(--muted);font-size:13px}
.hero{border:1px solid var(--line);border-radius:4px;background:var(--panel2);padding:10px 12px;margin-bottom:12px}
.hv{font:500 30px/1.1 var(--mono);font-variant-numeric:tabular-nums;color:var(--accent);overflow-wrap:anywhere}
.hv .pre{font-size:16px;margin-right:4px;color:var(--muted)}
.hl{font-size:12px;color:var(--muted);margin-top:2px}
.pbody h3{margin:14px 0 4px;font:600 11px/1.2 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.rows{margin:0;padding:0}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:5px 0;border-bottom:1px solid var(--line)}
.row dt{margin:0;font-size:13px}
.row dd{margin:0;font:400 13px/1.45 var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.row.total dt,.row.total dd{font-weight:600;color:var(--fg)}
.row.total dd{color:var(--accent)}
.row.sub dd{color:var(--warn)}

.tw{overflow-x:auto}
.tb{border-collapse:collapse;width:100%;font:400 11.5px/1.4 var(--mono);font-variant-numeric:tabular-nums}
.tb th{font-weight:500;color:var(--muted);text-align:right;padding:3px 6px;white-space:nowrap;border-bottom:1px solid var(--line)}
.tb td{padding:4px 6px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
.tb th:first-child,.tb td:first-child{text-align:left;white-space:normal;font-family:var(--body);font-size:12px;min-width:104px;position:sticky;left:0;background:var(--panel)}
.tb tr.total td{font-weight:500;color:var(--accent)}
.tb td.neg{color:var(--warn)}
.split{display:flex;height:14px;border-radius:3px;overflow:hidden;border:1px solid var(--line);margin-top:8px}
.split span{display:block;height:100%}
.legend{display:flex;justify-content:space-between;gap:10px;margin-top:5px;font:400 11px/1.3 var(--mono);color:var(--muted)}
.hint{margin:14px 0 0;font-size:12px;color:var(--muted)}

.nav{flex:none;border-top:1px solid var(--line);background:var(--bg);padding-block:8px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.navcap{margin:0 0 6px;font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.steps{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(120px,1fr);gap:6px;overflow-x:auto;padding-bottom:2px}
.step{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 8px 7px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.step:hover{background:var(--panel2)}
.step[aria-current="true"]{border-color:var(--accent);background:var(--panel2)}
.step .num{font:500 11px/1 var(--mono);letter-spacing:.06em}
.step .nm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step .val{font:400 11px/1.2 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.step .barx{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:3px}
.step .barx i{display:block;height:100%}

@media (max-width:760px){

}

function countTo(el,val,d){
  cancelAnimationFrame(raf);
  el.textContent = f(val,d);
  if(reduce) return;
  var t0 = performance.now();
  var tick = function(now){
    var k = Math.min(1,(now-t0)/600), e = 1-Math.pow(1-k,3);
    el.textContent = f(val*e,d);
    if(k<1) raf = requestAnimationFrame(tick); else el.textContent = f(val,d);
  };
  raf = requestAnimationFrame(tick);
}

/* helpers de geometría */
function rng(seed){ return function(){ seed = (seed*16807)%2147483647; return (seed-1)/2147483646; }; }

function box(w,h,d,mat){ return mesh(new THREE.BoxGeometry(w,h,d),mat); }
function tor(r,t,mat,seg){ return mesh(new THREE.TorusGeometry(r,t,12,seg||40),mat); }
function at(o,x,y,z){ o.position.set(x,y,z); return o; }
function pivot(g,x,y,z){ var p = new THREE.Group(); p.position.set(x,y,z); g.add(p); return p; }

/* flujo de costo: tubo + partículas que viajan */
function flow(a,b,color,opts){
  opts = opts||{};
  var curve = new THREE.LineCurve3(a,b);
  if(opts.tube!==false){
    var t = mesh(new THREE.TubeGeometry(curve,2,0.13,10,false), M.dark);
    t.castShadow = false; scene.add(t);
  }
  var n = opts.n||7, len = a.distanceTo(b), parts = [];
  var mat = new THREE.MeshBasicMaterial({color:color});
  for(var k=0;k<n;k++){ var p = new THREE.Mesh(new THREE.SphereGeometry(opts.r||0.17,12,10),mat); scene.add(p); parts.push(p); }
  var speed = opts.speed||2.0;
  ticks.push(function(t){
    for(var k=0;k<n;k++){ var u = (k/n + t*speed/len)%1; parts[k].position.copy(curve.getPointAt(u)); }
  });
}

  build(g,COL[i]);
  scene.add(g);
  stations.push({g:g,glow:glowMat,light:light});
}

    [-1.6,-0.5,0.6,1.6].forEach(function(x){ var rr = tor(0.97,0.07,M.dark,36); rr.rotation.y = Math.PI/2; rr.position.x = x; dp.add(rr); });
    for(var q=0;q<6;q++){ var a = q/6*Math.PI*2, fin = box(3.6,0.08,0.3,pm); fin.position.set(0,Math.cos(a)*0.7,Math.sin(a)*0.7); fin.rotation.x = a; dp.add(fin); }
    spin(dp,'x',1.1);
    g.add(at(box(0.5,1.5,1.8,M.dark),-2.0,1.05,0));
    g.add(at(box(0.5,1.5,1.8,M.dark),0.5,1.05,0));
    g.add(at(box(1.2,2.0,1.6,pm),2.1,1.3,-2.2));
    g.add(at(cyl(0.2,0.2,2.4,M.steel,12),2.1,3.5,-2.2));
    var fu = cyl(0.6,0.25,0.9,pm,24,true); fu.material = paint(col,true); fu.position.set(2.3,3.2,0); g.add(fu);
    g.add(at(cyl(0.25,0.25,0.5,M.steel,12),2.3,2.65,0));
    g.add(at(box(1.8,2.2,1.8,pm),3.0,1.4,0));
    g.add(at(box(1.0,0.3,1.0,M.dark),3.0,2.65,0));
    g.add(at(box(3.6,0.18,0.9,M.belt),5.7,0.8,0));
    [4.3,7.1].forEach(function(x){ [-0.35,0.35].forEach(function(z){ g.add(at(cyl(0.05,0.05,0.7,M.dark,8),x,0.45,z)); }); });
    var bags = [];
    for(var j=0;j<4;j++){ var bg = box(0.7,0.32,0.46,M.bag); bg.position.set(4.0,1.07,0); g.add(bg); bags.push(bg); }
    ticks.push(function(t){ for(var j=0;j<4;j++) bags[j].position.x = 4.0 + ((j/4*3.4 + t*0.9)%3.4); });
    g.add(at(box(1.6,0.14,1.2,M.dark),8.6,0.07,0));
    for(var layer=0;layer<3;layer++){ [-0.38,0.38].forEach(function(x){ [-0.25,0.25].forEach(function(z){ g.add(at(box(0.7,0.32,0.46,M.bag),8.6+x,0.3+layer*0.33,z)); }); }); }
  });

  /* tanque de melaza */
  var tk = new THREE.Group(); tk.position.set(14.4,0,11.2);
  tk.add(at(box(4.6,0.3,4.6,M.plat),0,0.15,0));
  tk.add(at(cyl(1.9,1.9,3.6,M.melaza,48),0,2.1,0));
  var td = mesh(new THREE.SphereGeometry(1.9,40,14,0,Math.PI*2,0,Math.PI/2),M.melaza); td.scale.y = 0.3; td.position.y = 3.9; tk.add(td);
  [1.2,2.2,3.2].forEach(function(y){ var rr = tor(1.9,0.06,M.steel,48); rr.rotation.x = Math.PI/2; rr.position.y = y; tk.add(rr); });
  tk.add(at(box(0.14,2.8,0.06,new THREE.MeshBasicMaterial({color:0xe8a33d})),0,2.0,1.93));
  scene.add(tk);

  /* flujos de costo y materiales */
  flow(wp(0,4.3,2.1,0), wp(1,-3.6,3.3,0), 0xf2b155);
  flow(wp(1,2.0,1.0,0), wp(2,-4.0,2.3,0), 0xd8d06a);
  flow(wp(2,3.35,1.2,0), wp(3,-4.0,2.4,0), 0xe0b04a);
  flow(wp(3,3.65,1.6,0), wp(4,-2.8,2.1,0), 0xf5ecd0);
  flow(new THREE.Vector3(14.4,1.5,1.4), new THREE.Vector3(14.4,1.5,9.35), 0x9b6a45);
  flow(wp(1,0,2.8,-1.7), wp(1,0,1.4,-5.0), 0x9b7a4a, {tube:false,n:5,speed:1.3,r:0.14});

  /* etiquetas HTML sobre la escena */
  var names = ['I · Recepción','II · Molienda','III · Clarificación','IV · Cristalización','V · Envasado'];
  var ly = [6.4,6.4,10.2,6.6,6.0];
  names.forEach(function(n,i){
    var b = document.createElement('button'); b.type='button'; b.className='lbl'; b.style.setProperty('--c',hex(COL[i]));
    b.innerHTML = '<i></i>'+n; b.addEventListener('click', function(){ go(i+1); });
    labelsEl.appendChild(b);
    labelItems.push({el:b,btn:true,idx:i,pos:new THREE.Vector3(S[i],ly[i],0)});
  });
  [['Bagazo · crédito <b>S/ 140,000</b>',new THREE.Vector3(S[1],2.6,-7.6)],
   ['Melaza · <b>S/ 196,179.14</b>',new THREE.Vector3(14.4,5.2,11.2)],
   ['Azúcar rubia · <b>S/ 2.4951 /kg</b>',new THREE.Vector3(S[4]+8.6,2.2,0)]].forEach(function(t){
    var d = document.createElement('div'); d.className='lbl tag'; d.innerHTML = t[0]; labelsEl.appendChild(d);
    labelItems.push({el:d,btn:false,idx:-9,pos:t[1]});
  });
}

/* cámara por paso */
function isNarrow(){ return stage.clientWidth <= 760; }
function camGoal(){
  var w = stage.clientWidth||800, h = stage.clientHeight||500, asp = w/h;
  if(step===0){
    var d = Math.max(48,Math.min(150,93/asp));
    return {pos:new THREE.Vector3(0,d*0.5,d*0.78+2), tgt:new THREE.Vector3(0,1,2)};
  }
  if(step===6){
    var nr = isNarrow(), sx = nr?0:3.5;
    return {pos:new THREE.Vector3(18+sx,nr?24:15,nr?44:31), tgt:new THREE.Vector3(18+sx,nr?-3:1.5,5)};
  }
  var cx = S[step-1], nw = isNarrow();
  var shift = nw?0:3.6;
  var back = nw ? 22 : 15;
  return {pos:new THREE.Vector3(cx+shift+6,nw?12:9,back), tgt:new THREE.Vector3(cx+shift,nw?-1.5:1.8,0)};
}
function applyCam(instant){
  if(!camera) return;
  var g = camGoal();
  if(instant){ camera.position.copy(g.pos); controls.target.copy(g.tgt); goal = null; controls.update(); }
  else goal = g;
}

/* ciclo de render */
var clock = null, tmp = null;
function frame(){
  requestAnimationFrame(frame);
  var dt = Math.min(clock.getDelta(),0.1);
  if(animOn){
    simT += dt;
    for(var i=0;i<spinners.length;i++){ var s = spinners[i]; s.o.rotation[s.axis] += s.speed*dt; }
    for(var k=0;k<ticks.length;k++) ticks[k](simT);
  }
  if(goal){
    var k2 = 1-Math.pow(0.04,dt);
    camera.position.lerp(goal.pos,k2); controls.target.lerp(goal.tgt,k2);
    if(camera.position.distanceTo(goal.pos)<0.05 && controls.target.distanceTo(goal.tgt)<0.05) goal = null;
  }
  controls.update();
  var act = [];
  if(step>=1&&step<=5) act[step-1] = 1; else if(step===6){ act[3] = 0.6; act[4] = 0.6; }
  for(var i2=0;i2<stations.length;i2++){
    var st = stations[i2], a = act[i2]||0;
    st.light.intensity += ((0.45+a*2.2)-st.light.intensity)*Math.min(1,dt*6);
    st.glow.opacity += ((0.28+a*0.65)-st.glow.opacity)*Math.min(1,dt*6);
  }
  renderer.render(scene,camera);
  var w = stage.clientWidth, h = stage.clientHeight;
  for(var j=0;j<labelItems.length;j++){
    var L = labelItems[j]; tmp.copy(L.pos).project(camera);
    if(tmp.z>1||tmp.z<-1){ L.el.style.display='none'; continue; }
    L.el.style.display = '';
    L.el.style.transform = 'translate('+((tmp.x*0.5+0.5)*w).toFixed(1)+'px,'+((-tmp.y*0.5+0.5)*h).toFixed(1)+'px) translate(-50%,-100%)';
  }
}
function resize(){
  var w = stage.clientWidth, h = stage.clientHeight;
  if(!w||!h||!renderer) return;
  renderer.setSize(w,h); camera.aspect = w/h; camera.updateProjectionMatrix();
  if(!userMoved) applyCam(true);
}

/* interacción */
function bindPick(){
  var ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), down = null;
  var el = renderer.domElement;
  el.addEventListener('pointerdown', function(e){ down = [e.clientX,e.clientY]; });
  el.addEventListener('pointerup', function(e){
    if(!down || Math.hypot(e.clientX-down[0],e.clientY-down[1])>5){ down = null; return; }
    down = null;
    var r = el.getBoundingClientRect();
    ndc.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
    ray.setFromCamera(ndc,camera);
    var hits = ray.intersectObjects(stations.map(function(s){ return s.g; }),true);
    if(!hits.length) return;
    var o = hits[0].object;
    while(o && o.userData.idx===undefined) o = o.parent;
    if(o) go(o.userData.idx+1);
  });
}
var autoTimer = 0;
document.getElementById('prev').addEventListener('click', function(){ go(step-1); });
document.getElementById('next').addEventListener('click', function(){ go(step+1); });
document.getElementById('auto').addEventListener('click', function(e){
  var on = e.currentTarget.getAttribute('aria-pressed')!=='true';
  e.currentTarget.setAttribute('aria-pressed',on);
  clearInterval(autoTimer);
  if(on) autoTimer = setInterval(function(){ go(step+1); },9000);
});
document.getElementById('anim').addEventListener('click', function(e){
  animOn = !animOn; e.currentTarget.setAttribute('aria-pressed',animOn);
});
document.getElementById('full').addEventListener('click', function(){
  try{
    if(document.fullscreenElement){ document.exitFullscreen(); }
    else if(document.documentElement.requestFullscreen){ var p = document.documentElement.requestFullscreen(); if(p&&p.catch) p.catch(function(){}); }
  }catch(e){}
});
document.getElementById('anim').setAttribute('aria-pressed',animOn);
document.addEventListener('keydown', function(e){
  if(e.key==='ArrowRight'){ go(step+1); } else if(e.key==='ArrowLeft'){ go(step-1); }
});

var ok = init3D();
if(ok){
  clock = new THREE.Clock(); tmp = new THREE.Vector3();
  bindPick();
  if(window.ResizeObserver) new ResizeObserver(resize).observe(stage); else window.addEventListener('resize',resize);
  resize();
  go(0);
  applyCam(true);
  frame();
} else {
  go(0);
}
})();
</script>
